<svg xmlns="http://www.w3.org/2000/svg" width="700" height="375" font-family="Arial" font-size="11">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Actor -->
  <circle cx="55" cy="33" r="11" fill="white" stroke="#333" stroke-width="1.5"/>
  <line x1="55" y1="44" x2="55" y2="82" stroke="#333" stroke-width="1.5"/>
  <line x1="36" y1="62" x2="74" y2="62" stroke="#333" stroke-width="1.5"/>
  <line x1="55" y1="82" x2="37" y2="107" stroke="#333" stroke-width="1.5"/>
  <line x1="55" y1="82" x2="73" y2="107" stroke="#333" stroke-width="1.5"/>
  <text x="55" y="123" text-anchor="middle" font-size="10">Platform</text>
  <text x="55" y="136" text-anchor="middle" font-size="10">Manager</text>

  <!-- Participant boxes -->
  <rect x="117" y="20" width="150" height="36" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="192" y="43" text-anchor="middle" font-weight="bold">search_category.js</text>

  <rect x="315" y="20" width="182" height="36" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="406" y="43" text-anchor="middle" font-weight="bold">SearchCategoryController</text>

  <rect x="543" y="20" width="125" height="36" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="605" y="43" text-anchor="middle" font-weight="bold">FRACategory</text>

  <!-- Lifelines -->
  <line x1="55" y1="140" x2="55" y2="370" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="192" y1="56" x2="192" y2="370" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="406" y1="56" x2="406" y2="370" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="605" y1="56" x2="605" y2="370" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Activation bars -->
  <rect x="188" y="157" width="8" height="183" fill="#e8e8e8" stroke="#888" stroke-width="0.8"/>
  <rect x="402" y="177" width="8" height="122" fill="#e8e8e8" stroke="#888" stroke-width="0.8"/>
  <rect x="601" y="197" width="8" height="50" fill="#e8e8e8" stroke="#888" stroke-width="0.8"/>

  <!-- 1: Actor → Boundary -->
  <line x1="55" y1="160" x2="188" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="121" y="154" text-anchor="middle" font-size="10">searchCategories()</text>

  <!-- 2: Boundary → Controller -->
  <line x1="196" y1="180" x2="402" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="299" y="174" text-anchor="middle" font-size="10">search(q: str, status: str)</text>

  <!-- 3: Controller → Entity -->
  <line x1="410" y1="200" x2="601" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="505" y="194" text-anchor="middle" font-size="10">search(q: str, status: str)</text>

  <!-- 4: Entity → Controller (return) -->
  <line x1="601" y1="250" x2="410" y2="250" stroke="#666" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="505" y="244" text-anchor="middle" font-size="10">return list</text>

  <!-- 5: Controller → Boundary (return) -->
  <line x1="402" y1="300" x2="196" y2="300" stroke="#666" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="299" y="294" text-anchor="middle" font-size="10">return list</text>

  <!-- 6: Boundary → Actor (return) -->
  <line x1="188" y1="340" x2="55" y2="340" stroke="#666" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="121" y="334" text-anchor="middle" font-size="10">renderTable(cats)</text>
</svg>
