<svg xmlns="http://www.w3.org/2000/svg" width="738" height="375" font-family="Arial" font-size="11">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Actor -->
  <circle cx="55" cy="33" r="11" fill="white" stroke="#333" stroke-width="1.5"/>
  <line x1="55" y1="44" x2="55" y2="82" stroke="#333" stroke-width="1.5"/>
  <line x1="36" y1="62" x2="74" y2="62" stroke="#333" stroke-width="1.5"/>
  <line x1="55" y1="82" x2="37" y2="107" stroke="#333" stroke-width="1.5"/>
  <line x1="55" y1="82" x2="73" y2="107" stroke="#333" stroke-width="1.5"/>
  <text x="55" y="123" text-anchor="middle" font-size="10">Platform</text>
  <text x="55" y="136" text-anchor="middle" font-size="10">Manager</text>

  <!-- Participant boxes -->
  <rect x="117" y="20" width="162" height="36" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="198" y="43" text-anchor="middle" font-weight="bold">get_category_details.js</text>

  <rect x="330" y="20" width="208" height="36" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="434" y="43" text-anchor="middle" font-weight="bold">GetCategoryDetailsController</text>

  <rect x="590" y="20" width="120" height="36" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="650" y="43" text-anchor="middle" font-weight="bold">FRACategory</text>

  <!-- Lifelines -->
  <line x1="55" y1="140" x2="55" y2="370" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="198" y1="56" x2="198" y2="370" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="434" y1="56" x2="434" y2="370" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="650" y1="56" x2="650" y2="370" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Activation bars -->
  <rect x="194" y="157" width="8" height="183" fill="#e8e8e8" stroke="#888" stroke-width="0.8"/>
  <rect x="430" y="177" width="8" height="122" fill="#e8e8e8" stroke="#888" stroke-width="0.8"/>
  <rect x="646" y="197" width="8" height="50" fill="#e8e8e8" stroke="#888" stroke-width="0.8"/>

  <!-- 1: Actor → Boundary -->
  <line x1="55" y1="160" x2="194" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="124" y="154" text-anchor="middle" font-size="10">loadCategory()</text>

  <!-- 2: Boundary → Controller -->
  <line x1="202" y1="180" x2="430" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="316" y="174" text-anchor="middle" font-size="10">getCategory(category_id: int)</text>

  <!-- 3: Controller → Entity -->
  <line x1="438" y1="200" x2="646" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="542" y="194" text-anchor="middle" font-size="10">getById(category_id: int)</text>

  <!-- 4: Entity → Controller (return) -->
  <line x1="646" y1="250" x2="438" y2="250" stroke="#666" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="542" y="244" text-anchor="middle" font-size="10">return dict</text>

  <!-- 5: Controller → Boundary (return) -->
  <line x1="430" y1="300" x2="202" y2="300" stroke="#666" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="316" y="294" text-anchor="middle" font-size="10">return dict</text>

  <!-- 6: Boundary → Actor (return) -->
  <line x1="194" y1="340" x2="55" y2="340" stroke="#666" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="124" y="334" text-anchor="middle" font-size="10">render details</text>
</svg>
