<svg xmlns="http://www.w3.org/2000/svg" width="750" height="475" font-family="Arial" font-size="11">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Actor -->
  <circle cx="55" cy="33" r="11" fill="white" stroke="#333" stroke-width="1.5"/>
  <line x1="55" y1="44" x2="55" y2="82" stroke="#333" stroke-width="1.5"/>
  <line x1="36" y1="62" x2="74" y2="62" stroke="#333" stroke-width="1.5"/>
  <line x1="55" y1="82" x2="37" y2="107" stroke="#333" stroke-width="1.5"/>
  <line x1="55" y1="82" x2="73" y2="107" stroke="#333" stroke-width="1.5"/>
  <text x="55" y="123" text-anchor="middle" font-size="10">Platform</text>
  <text x="55" y="136" text-anchor="middle" font-size="10">Manager</text>

  <!-- Participant boxes -->
  <rect x="117" y="20" width="168" height="36" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="201" y="43" text-anchor="middle" font-weight="bold">get_platform_report.js</text>

  <rect x="340" y="20" width="202" height="36" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="441" y="43" text-anchor="middle" font-weight="bold">GetPlatformReportController</text>

  <rect x="598" y="20" width="130" height="36" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="663" y="43" text-anchor="middle" font-weight="bold">PlatformReport</text>

  <!-- Lifelines -->
  <line x1="55" y1="140" x2="55" y2="470" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="201" y1="56" x2="201" y2="470" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="441" y1="56" x2="441" y2="470" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="663" y1="56" x2="663" y2="470" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Activation bars -->
  <rect x="197" y="157" width="8" height="288" fill="#e8e8e8" stroke="#888" stroke-width="0.8"/>
  <rect x="437" y="177" width="8" height="228" fill="#e8e8e8" stroke="#888" stroke-width="0.8"/>
  <rect x="659" y="197" width="8" height="148" fill="#e8e8e8" stroke="#888" stroke-width="0.8"/>

  <!-- 1: Actor → Boundary -->
  <line x1="55" y1="160" x2="197" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="126" y="154" text-anchor="middle" font-size="10">loadReport('weekly')</text>

  <!-- 2: Boundary → Controller -->
  <line x1="205" y1="180" x2="437" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="321" y="174" text-anchor="middle" font-size="10">getReport(period: str)</text>

  <!-- 3: Controller → Entity (call 1) -->
  <line x1="445" y1="200" x2="659" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="552" y="194" text-anchor="middle" font-size="10">getReportStats(period, conn)</text>

  <!-- 4: Entity → Controller (return 1) -->
  <line x1="659" y1="228" x2="445" y2="228" stroke="#666" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="552" y="222" text-anchor="middle" font-size="10">return stats dict</text>

  <!-- 5: Controller → Entity (call 2) -->
  <line x1="445" y1="256" x2="659" y2="256" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="552" y="250" text-anchor="middle" font-size="10">getRecentFRAActivity(period, conn)</text>

  <!-- 6: Entity → Controller (return 2) -->
  <line x1="659" y1="284" x2="445" y2="284" stroke="#666" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="552" y="278" text-anchor="middle" font-size="10">return activity list</text>

  <!-- 7: Controller → Entity (call 3) -->
  <line x1="445" y1="312" x2="659" y2="312" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="552" y="306" text-anchor="middle" font-size="10">getViewsByCategory(conn)</text>

  <!-- 8: Entity → Controller (return 3) -->
  <line x1="659" y1="348" x2="445" y2="348" stroke="#666" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="552" y="342" text-anchor="middle" font-size="10">return chart list</text>

  <!-- 9: Controller → Boundary (return) -->
  <line x1="437" y1="395" x2="205" y2="395" stroke="#666" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="321" y="389" text-anchor="middle" font-size="10">return {stats, recent, chart_data}</text>

  <!-- 10: Boundary → Actor (return) -->
  <line x1="197" y1="435" x2="55" y2="435" stroke="#666" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="126" y="429" text-anchor="middle" font-size="10">renderStats() + renderChart()</text>
</svg>
