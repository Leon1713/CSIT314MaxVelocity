<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home</title>

        <link rel="stylesheet" href="/styles/styles.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
            rel="stylesheet" />
    </head>
    <body>
        <nav class="fundly-navbar navbar">
            <div class="container-fluid px-4 d-flex align-items-center gap-3">

                <a href="index.html" class="fundly-logo-wrap">
                    <img src="/img/fundly-logo.png" alt="Fundly Logo"
                        class="fundly-logo-img" />
                </a>

                <div class="flex-grow-1 d-flex justify-content-center">
                    <div class="fundly-search-wrap">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" placeholder="Search fundraisers..."
                            aria-label="Search fundraisers" />
                    </div>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <a href="login.html" class="fundly-sign-in">Sign In</a>
                    <a href="sign_up.html" class="fundly-join-btn">Join Us</a>
                </div>

            </div>
        </nav>

        <footer class="fundly-footer">

            <div class="footer-top">
                <div class="footer-brand">
                    <img src="img/fundly-logo.png" alt="Fundly Logo"
                        class="footer-logo-img" />
                </div>
                <div class="footer-credits">
                    made by jia yuan, chloe,<br />
                    tara, yaz, yadyoo &amp; hanyi
                </div>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-bottom">
                <i class="bi bi-c-circle footer-copy-icon"></i>
                <span class="footer-copy-text">Fundly</span>
            </div>

        </footer>

    </body>
</html>
