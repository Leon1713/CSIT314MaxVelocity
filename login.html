<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In</title>

  <link rel="stylesheet" href="/styles/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>

<body class="login-page">

  <!-- Animated tiling background -->
  <div class="login-bg-pattern"></div>

  <!-- Centred login card -->
  <div class="login-wrapper d-flex align-items-center justify-content-center">
    <div class="login-card">

      <div class="login-logo-wrap">
        <img src="img/fundly-logo.png" alt="Fundly Logo" class="login-logo-img" />
      </div>

      <h1 class="login-title">Sign In</h1>
      <p class="login-subtitle">Sign in, or sign up to continue.</p>

      <form class="login-form" novalidate id ="login-form">
        <div class="login-field-wrap">
          <input type="email" id="loginEmail" class="login-input" placeholder="Email" autocomplete="email" required />
        </div>
        <div class="login-field-wrap">
          <input type="password" id="loginPassword" class="login-input" placeholder="Password"
            autocomplete="current-password" required />
        </div>

        <button type="submit" class="login-btn">Sign In</button>

      </form>
      <p class="login-footer-text">
        Don't have an account?
        <a href="sign_up.html" class="login-signup-link">Sign up.</a>
      </p>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/scripts/login.js"></script>
</body>

</html>
