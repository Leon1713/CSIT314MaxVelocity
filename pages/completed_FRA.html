<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Completed FRA History</title>

        <link rel="stylesheet" href="/styles/styles.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
            rel="stylesheet" />
    </head>
    <body class="manage-fra-page">

        <nav class="fundly-hub-navbar">
            <div class="container-fluid px-4 d-flex align-items-center">
                <div class="hub-nav-logo">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo"
                        class="fundly-logo-img" />
                </div>
                <span class="hub-nav-title">Completed FRA History</span>
                <div class="hub-gear-wrap ms-auto">
                    <button class="hub-nav-gear" id="hub-gear-btn" aria-label="Settings">
                        <i class="bi bi-gear-fill"></i>
                    </button>
                    <div id="hub-settings-dropdown" class="hub-settings-dropdown hidden">
                        <p class="hub-dropdown-section">Account</p>
                        <div class="hub-dropdown-user">
                            <div class="hub-dropdown-avatar-wrap">
                                <i class="bi bi-person-fill" id="dropdown-avatar-icon"></i>
                                <img id="dropdown-avatar-img" class="hidden" alt="" />
                            </div>
                            <div>
                                <span class="hub-dropdown-username" id="dropdown-username"></span>
                                <span class="hub-dropdown-role" id="dropdown-role"></span>
                            </div>
                        </div>
                        <div class="hub-dropdown-divider"></div>
                        <a href="profile.html" class="hub-dropdown-item">
                            <i class="bi bi-person-circle"></i>My Profile
                        </a>
                        <button class="hub-dropdown-item hub-dropdown-logout" id="hub-logout-btn">
                            <i class="bi bi-box-arrow-right"></i>Logout
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="manage-main">

            <a href="manage_FRA.html" class="fr-back-link">
                <i class="bi bi-arrow-left-circle"></i> Back
            </a>

            <!-- Header -->
            <div class="manage-header">
                <h2 class="manage-header-title">Completed FRA History</h2>
            </div>

            <!-- Search filters -->
            <div class="completed-filters">
                <!-- Row 1: keyword search -->
                <div class="completed-search-row">
                    <div class="manage-search-wrap" style="flex:1;">
                        <i class="bi bi-search"></i>
                        <input
                            type="text"
                            id="filter-keyword"
                            class="manage-search-input"
                            placeholder="Search by title or description..."
                        />
                    </div>
                </div>
                <!-- Row 2: secondary filters + buttons -->
                <div class="completed-filter-row">
                    <select id="filter-category" class="manage-search-input completed-filter-service">
                        <option value="">All Categories</option>
                    </select>
                    <div class="completed-date-range">
                        <input type="date" id="filter-date-from" class="fr-form-input completed-date-input" />
                        <span class="completed-date-sep">to</span>
                        <input type="date" id="filter-date-to" class="fr-form-input completed-date-input" />
                    </div>
                    <div style="display:flex;gap:8px;margin-left:auto;">
                        <button class="manage-new-btn" id="btn-search">
                            <i class="bi bi-funnel-fill"></i> Filter
                        </button>
                        <button class="manage-history-btn" id="btn-clear">
                            <i class="bi bi-x-circle"></i> Clear
                        </button>
                    </div>
                </div>
            </div>

            <!-- Activity list -->
            <div class="manage-activity-list" id="completed-activity-list">
                <!-- Populated by JS -->
            </div>

        </main>

        <footer class="fundly-footer">
            <div class="footer-top">
                <div class="footer-brand">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo"
                        class="footer-logo-img" />
                </div>
                <div class="footer-credits">
                    made by jia yuan, chloe,<br />
                    tara, yaz, yadyoo &amp; hanyi
                </div>
            </div>
            <div class="footer-divider"></div>
            <div class="footer-bottom">
                <i class="bi bi-c-circle footer-copy-icon"></i>
                <span class="footer-copy-text">Fundly</span>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/scripts/get_completed_FRA.js"></script>
        <script src="/scripts/dropdown_profile.js"></script>
    </body>
</html>
