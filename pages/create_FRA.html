<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Create Fund Raising Activity</title>

        <link rel="stylesheet" href="/styles/styles.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
            rel="stylesheet" />
    </head>
    <body class="fr-create-page">

        <nav class="fundly-hub-navbar">
            <div class="container-fluid px-4 d-flex align-items-center">
                <div class="hub-nav-logo">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo"
                        class="fundly-logo-img" />
                </div>
                <span class="hub-nav-title">Create Fund Raising Activity</span>
                <div class="hub-gear-wrap ms-auto">
                    <button class="hub-nav-gear" id="hub-gear-btn" aria-label="Settings">
                        <i class="bi bi-gear-fill"></i>
                    </button>
                    <div id="hub-settings-dropdown" class="hub-settings-dropdown hidden">
                        <p class="hub-dropdown-section">Account</p>
                        <div class="hub-dropdown-user">
                            <div class="hub-dropdown-avatar-wrap">
                                <i class="bi bi-person-fill" id="dropdown-avatar-icon"></i>
                                <img id="dropdown-avatar-img" class="hidden" alt="" />
                            </div>
                            <div>
                                <span class="hub-dropdown-username" id="dropdown-username"></span>
                                <span class="hub-dropdown-role" id="dropdown-role"></span>
                            </div>
                        </div>
                        <div class="hub-dropdown-divider"></div>
                        <a href="profile.html" class="hub-dropdown-item">
                            <i class="bi bi-person-circle"></i>My Profile
                        </a>
                        <a href="#" class="hub-dropdown-item">
                            <i class="bi bi-envelope"></i>Notifications
                        </a>
                        <button class="hub-dropdown-item hub-dropdown-logout" id="hub-logout-btn">
                            <i class="bi bi-box-arrow-right"></i>Logout
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="fr-create-main">

            <a href="fundraiser_dashboard.html" class="fr-back-link">
                <i class="bi bi-arrow-left-circle"></i> Back
            </a>

            <div class="fr-form-card">

                <div class="fr-form-row">
                    <div class="fr-form-group">
                        <label class="fr-form-label" for="fra-title">Campaign Title</label>
                        <input
                            type="text"
                            id="fra-title"
                            class="fr-form-input"
                            placeholder="e.g., Help build a school in Bedok"
                        />
                    </div>
                    <div class="fr-form-group">
                        <label class="fr-form-label" for="fra-service-type">Service Type</label>
                        <input
                            type="text"
                            id="fra-service-type"
                            class="fr-form-input"
                            placeholder="e.g., Cancer treatment"
                        />
                    </div>
                </div>

                <div class="fr-form-group">
                    <label class="fr-form-label" for="fra-description">Description</label>
                    <textarea
                        id="fra-description"
                        class="fr-form-input fr-form-textarea"
                        placeholder="Tell donees what this campaign is about."
                    ></textarea>
                </div>

                <div class="fr-form-row">
                    <div class="fr-form-group">
                        <label class="fr-form-label" for="fra-goal">Goal Amount (SGD)</label>
                        <div class="fr-input-prefix-wrap">
                            <span class="fr-input-prefix">$</span>
                            <input
                                type="number"
                                id="fra-goal"
                                class="fr-form-input fr-form-input-prefixed"
                                placeholder="0"
                                min="1"
                            />
                        </div>
                    </div>
                    <div class="fr-form-group">
                        <label class="fr-form-label" for="fra-category">Category</label>
                        <select id="fra-category" class="fr-form-input fr-form-select">
                            <option value="" disabled selected>Loading…</option>
                        </select>
                    </div>
                </div>

                <div class="fr-form-row">
                    <div class="fr-form-group">
                        <label class="fr-form-label" for="fra-start">Start Date</label>
                        <input type="date" id="fra-start" class="fr-form-input" />
                    </div>
                    <div class="fr-form-group">
                        <label class="fr-form-label" for="fra-end">End Date</label>
                        <input type="date" id="fra-end" class="fr-form-input" />
                    </div>
                </div>

                <p class="fra-form-error hidden" id="fra-error"></p>

                <div class="fr-form-actions">
                    <a href="fundraiser_dashboard.html" class="fr-cancel-btn">Cancel</a>
                    <button class="fr-submit-btn" id="fra-submit-btn">Submit Activity</button>
                </div>

            </div>

        </main>

        <footer class="fundly-footer">

            <div class="footer-top">
                <div class="footer-brand">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo"
                        class="footer-logo-img" />
                </div>
                <div class="footer-credits">
                    made by jia yuan, chloe,<br />
                    tara, yaz, yadyoo &amp; hanyi
                </div>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-bottom">
                <i class="bi bi-c-circle footer-copy-icon"></i>
                <span class="footer-copy-text">Fundly</span>
            </div>

        </footer>

        <!-- Success toast -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1100">
            <div id="fra-success-toast" class="toast cat-toast border-0" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="cat-toast-inner">
                    <div class="cat-toast-icon"><i class="bi bi-check-lg"></i></div>
                    <span class="cat-toast-msg" id="fra-toast-msg"></span>
                    <button type="button" class="cat-toast-close" data-bs-dismiss="toast"><i class="bi bi-x"></i></button>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/scripts/create_FRA.js"></script>
        <script src="/scripts/dropdown_profile.js"></script>
    </body>
</html>
