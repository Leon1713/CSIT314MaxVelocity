<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fundly — Join Us</title>

  <link rel="stylesheet" href="/styles/styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

</head>

<body class="login-page">

  <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="errorModalLabel">Login Error</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="errorModalMessage">
          <!-- Error message will be injected here -->
        </div>
      </div>
    </div>
  </div>

  <div id="login-modal-page">
    <!--Error modal-->
    <!-- Animated tiling background -->
    <div class="login-bg-pattern"></div>

    <!-- Centred signup card -->
    <div class="login-wrapper d-flex align-items-center justify-content-center">
      <div class="login-card signup-card">

        <div class="login-logo-wrap">
          <img src="/img/fundly-logo.png" alt="Fundly Logo" class="login-logo-img" />
        </div>

        <h1 class="login-title">Join Us</h1>
        <p class="login-subtitle">Sign up to use our platform.</p>

        <!-- Form -->
        <form class="login-form" id="signup-form" novalidate>

          <!-- First + Last name side by side -->
          <div class="signup-input-ctn">
            <div class="signup-name-row">
              <input type="text" id="signupFirstName" class="login-input" placeholder="First name"
                autocomplete="given-name" required />
              <input type="text" id="signupLastName" class="login-input" placeholder="Last name (Optional)"
                autocomplete="family-name" />
            </div>
            <div class="signup-error-ctn " id ="name-error">
                <div class="error-icon">
                  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24,12A12,12,0,1,1,12,0,12.013,12.013,0,0,1,24,12ZM13,5H11V15h2Zm0,12H11v2h2Z"></path>
                  </svg>
                </div>
                <span class="error-text">Enter First Name</span>
            </div>
          </div>

          <div class="login-field-wrap">
            <input type="email" id="signupEmail" class="login-input" placeholder="Email" autocomplete="email"
              pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,63}$" required />
              <div class="signup-error-ctn" id="email-error">
                <div class="error-icon">
                  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24,12A12,12,0,1,1,12,0,12.013,12.013,0,0,1,24,12ZM13,5H11V15h2Zm0,12H11v2h2Z"></path>
                  </svg>
                </div>
                <span class="error-text">Enter First Name</span>
            </div>
          </div>
          <div class="login-field-wrap">
            <input type="text" id="username" class="login-input" placeholder="username" autocomplete="" required />
          <div class="signup-error-ctn" id="username-error">
                <div class="error-icon">
                  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24,12A12,12,0,1,1,12,0,12.013,12.013,0,0,1,24,12ZM13,5H11V15h2Zm0,12H11v2h2Z"></path>
                  </svg>
                </div>
                <span class="error-text">Enter First Name</span>
            </div>
          </div>

          <div class="login-field-wrap">
            <input type="tel" id="signupPhone" class="login-input" placeholder="Phone number" autocomplete="tel"
              required />
              <div class="signup-error-ctn" id="phone-error">
                <div class="error-icon">
                  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24,12A12,12,0,1,1,12,0,12.013,12.013,0,0,1,24,12ZM13,5H11V15h2Zm0,12H11v2h2Z"></path>
                  </svg>
                </div>
                <span class="error-text">Enter First Name</span>
            </div>
          </div>

          <div class="login-field-wrap">
            <input type="password" id="signupPassword" class="login-input" placeholder="Password"
              autocomplete="new-password" required />
          </div>

          <div class="login-field-wrap">
            <input type="password" id="signupRepeatPassword" class="login-input" placeholder="Repeat password"
              autocomplete="new-password" required />
              <div class="signup-error-ctn" id="password-error">
                <div class="error-icon">
                  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24,12A12,12,0,1,1,12,0,12.013,12.013,0,0,1,24,12ZM13,5H11V15h2Zm0,12H11v2h2Z"></path>
                  </svg>
                </div>
                <span class="error-text">Enter First Name</span>
            </div>
          </div>

          <div class="login-divider"></div>

          <div class="login-role-row">
            <label for="signupRole" class="login-role-label">Sign up as a...</label>
            <select id="signupRole" class="login-role-select">
              <option value="donee">Donee</option>
              <option value="fundraiser">Fund Raiser</option>
            </select>
          </div>

          <button type="submit" class="login-btn" id="signup-btn">
            <div id="sign-in-text">Sign Up</div>
            <div class="loader-ctn hidden" id="login-loader">
              <div class="loader-btn login-loader"></div>
            </div>
          </button>
          <p class="signup-error hidden" id="signup-error"></p>

        </form>

        <!-- Footer link -->
        <p class="login-footer-text">
          Already have an account?
          <a href="login.html" class="login-signup-link">Sign in.</a>
        </p>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/scripts/create_account.js"></script>
</body>

</html>
