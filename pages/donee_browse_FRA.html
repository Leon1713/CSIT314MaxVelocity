<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Campaigns – Fundly</title>
    <link rel="stylesheet" href="/styles/styles.css">
    <link rel="stylesheet" href="/styles/donee_browse.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>

    </style>
</head>

<body class="fr-dashboard-page">

    <nav class="fundly-hub-navbar">
        <div class="container-fluid px-4 d-flex align-items-center">
            <div class="hub-nav-logo"><img src="../img/fundly-logo.png" alt="Fundly Logo" class="fundly-logo-img" />
            </div>
            <span class="hub-nav-title">Browse Campaigns</span>
            <div class="hub-gear-wrap ms-auto">
                <button class="hub-nav-gear" id="hub-gear-btn"><i class="bi bi-gear-fill"></i></button>
                <div id="hub-settings-dropdown" class="hub-settings-dropdown hidden">
                    <p class="hub-dropdown-section">Account</p>
                    <div class="hub-dropdown-user">
                        <div class="hub-dropdown-avatar-wrap">
                            <i class="bi bi-person-fill" id="dropdown-avatar-icon"></i>
                            <img id="dropdown-avatar-img" class="hidden" alt="" />
                        </div>
                        <div>
                            <span class="hub-dropdown-username" id="dropdown-username"></span>
                            <span class="hub-dropdown-role" id="dropdown-role"></span>
                        </div>
                    </div>
                    <div class="hub-dropdown-divider"></div>
                    <a href="profile.html" class="hub-dropdown-item"><i class="bi bi-person-circle"></i>My Profile</a>
                    <a href="donee_donation_history.html" class="hub-dropdown-item"><i
                            class="bi bi-clock-history"></i>Donation History</a>
                    <a href="#" class="hub-dropdown-item"><i class="bi bi-envelope"></i>Notifications</a>
                    <button class="hub-dropdown-item hub-dropdown-logout" id="hub-logout-btn"><i
                            class="bi bi-box-arrow-right"></i>Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="fr-dashboard-main" style="max-width:960px;">
        <a href="donee_dashboard.html" class="fr-back-link"><i class="bi bi-arrow-left-circle"></i> Back to
            Dashboard</a>

        <div class="donee-tabs">
            <button class="donee-tab active" id="tab-all" onclick="switchTab('all')">
                <i class="bi bi-grid-fill"></i> All Campaigns <span class="tab-count" id="count-all">—</span>
            </button>
            <button class="donee-tab" id="tab-fav" onclick="switchTab('fav')">
                <i class="bi bi-heart-fill"></i> My Favourites <span class="tab-count" id="count-fav">—</span>
            </button>
        </div>

        <div class="filter-bar">
            <div class="search-wrap">
                <i class="bi bi-search"></i>
                <input type="text" id="f-keyword" class="search-input" placeholder="Search campaigns…" />
            </div>
            <select id="f-category" class="filter-sel">
                <option value="">All Categories</option>
            </select>
            <span class="flabel">From</span>
            <input type="date" id="f-from" class="date-in" />
            <span class="flabel">To</span>
            <input type="date" id="f-to" class="date-in" />
            <button class="clear-btn" id="clear-btn"><i class="bi bi-x-lg"></i> Clear</button>
        </div>

        <div class="result-info" id="result-info"></div>
        <div class="fra-grid" id="fra-grid">
            <div style="border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 2px 12px rgba(201,107,107,.07)">
                <div class="skel" style="height:5px;border-radius:0"></div>
                <div style="padding:15px 16px;display:flex;flex-direction:column;gap:10px">
                    <div class="skel" style="height:18px;width:70%"></div>
                    <div class="skel" style="height:12px;width:38%"></div>
                    <div class="skel" style="height:24px"></div>
                    <div class="skel" style="height:5px"></div>
                </div>
            </div>
            <div style="border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 2px 12px rgba(201,107,107,.07)">
                <div class="skel" style="height:5px;border-radius:0"></div>
                <div style="padding:15px 16px;display:flex;flex-direction:column;gap:10px">
                    <div class="skel" style="height:18px;width:80%"></div>
                    <div class="skel" style="height:12px;width:42%"></div>
                    <div class="skel" style="height:24px"></div>
                    <div class="skel" style="height:5px"></div>
                </div>
            </div>
            <div style="border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 2px 12px rgba(201,107,107,.07)">
                <div class="skel" style="height:5px;border-radius:0"></div>
                <div style="padding:15px 16px;display:flex;flex-direction:column;gap:10px">
                    <div class="skel" style="height:18px;width:60%"></div>
                    <div class="skel" style="height:12px;width:35%"></div>
                    <div class="skel" style="height:24px"></div>
                    <div class="skel" style="height:5px"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="fundly-footer">
        <div class="footer-top">
            <div class="footer-brand"><img src="../img/fundly-logo.png" alt="Fundly Logo" class="footer-logo-img" />
            </div>
            <div class="footer-credits">made by jia yuan, chloe,<br />tara, yaz, yadyoo &amp; hanyi</div>
        </div>
        <div class="footer-divider"></div>
        <div class="footer-bottom"><i class="bi bi-c-circle footer-copy-icon"></i><span
                class="footer-copy-text">Fundly</span></div>
    </footer>

    <!-- Detail Modal -->
    <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content fra-delete-modal">
                <div class="modal-header fra-delete-modal-header border-0">
                    <i class="bi bi-megaphone-fill fra-save-modal-icon"></i>
                    <h5 class="modal-title fra-delete-modal-title">Campaign Details</h5>
                    <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body fra-delete-modal-body" style="max-height:72vh;overflow-y:auto;">
                    <div id="detail-body" style="display:flex;flex-direction:column;gap:14px;"></div>
                </div>
                <div class="modal-footer fra-delete-modal-footer border-0">
                    <button type="button" class="fr-cancel-btn" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="modal-fav-btn" id="modal-fav-btn">
                        <i class="bi bi-heart-fill"></i><span id="modal-fav-label">Save to Favourites</span>
                    </button>
                    <button type="button" class="modal-fav-btn" id="modal-donate-btn">
                        <i class="bi bi-cash"></i><span id="modal-donate-label">Donate now</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Remove Confirm Modal -->
    <div class="modal fade" id="removeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content fra-delete-modal">
                <div class="modal-header fra-delete-modal-header border-0">
                    <i class="bi bi-heartbreak-fill fra-delete-modal-icon"></i>
                    <h5 class="modal-title fra-delete-modal-title">Remove Favourite</h5>
                </div>
                <div class="modal-body fra-delete-modal-body">
                    <p id="remove-msg">Remove this campaign from your favourites?</p>
                </div>
                <div class="modal-footer fra-delete-modal-footer border-0">
                    <button type="button" class="fr-cancel-btn" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="fra-delete-confirm-btn" id="remove-confirm-btn">Remove</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1100">
        <div id="toast" class="toast cat-toast border-0" role="alert" aria-atomic="true">
            <div class="cat-toast-inner">
                <div class="cat-toast-icon"><i class="bi bi-check-lg"></i></div>
                <span class="cat-toast-msg" id="toast-msg">Done.</span>
                <button type="button" class="cat-toast-close" data-bs-dismiss="toast"><i class="bi bi-x"></i></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/scripts/dropdown_profile.js"></script>
    <script src="/scripts/donee_search.js"></script>
</body>

</html>
