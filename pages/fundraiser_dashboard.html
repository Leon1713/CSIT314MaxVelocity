<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fund Raiser Dashboard</title>

        <link rel="stylesheet" href="/styles/styles.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
            rel="stylesheet" />
    </head>
    <body class="fr-dashboard-page">

        <nav class="fundly-hub-navbar">
            <div class="container-fluid px-4 d-flex align-items-center">
                <div class="hub-nav-logo">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo"
                        class="fundly-logo-img" />
                </div>
                <span class="hub-nav-title">Fund Raiser Dashboard</span>
                <div class="hub-gear-wrap ms-auto">
                    <button class="hub-nav-gear" id="hub-gear-btn" aria-label="Settings">
                        <i class="bi bi-gear-fill"></i>
                    </button>
                    <div id="hub-settings-dropdown" class="hub-settings-dropdown hidden">
                        <p class="hub-dropdown-section">Account</p>
                        <div class="hub-dropdown-user">
                            <div class="hub-dropdown-avatar-wrap">
                                <i class="bi bi-person-fill" id="dropdown-avatar-icon"></i>
                                <img id="dropdown-avatar-img" class="hidden" alt="" />
                            </div>
                            <div>
                                <span class="hub-dropdown-username" id="dropdown-username"></span>
                                <span class="hub-dropdown-role" id="dropdown-role"></span>
                            </div>
                        </div>
                        <div class="hub-dropdown-divider"></div>
                        <a href="profile.html" class="hub-dropdown-item">
                            <i class="bi bi-person-circle"></i>My Profile
                        </a>
                        <button class="hub-dropdown-item hub-dropdown-logout" id="hub-logout-btn">
                            <i class="bi bi-box-arrow-right"></i>Logout
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="fr-dashboard-main">
       <a href="hub.html" class="fr-back-link">
            <i class="bi bi-arrow-left-circle"></i> Back
        </a>
            <!-- Overview banner -->
            <div class="fr-overview-card">
                <p class="fr-overview-welcome">Welcome back, <span id="fr-username">—</span></p>
                <p class="fr-overview-text">Here's an overview of your<br>fundraising activities.</p>
                <div class="fr-overview-actions">
                    <button class="fr-overview-btn" id="btn-create-activity">Create Activity</button>
                    <button class="fr-overview-btn" id="btn-manage-activities">Manage Activities</button>
                    <button class="fr-overview-btn fr-overview-btn-outline" id="btn-view-history">View History</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="fr-stats-row">
                <div class="fr-stat-card">
                    <span class="fr-stat-label">Total Activities</span>
                    <span class="fr-stat-value" id="stat-total">—</span>
                </div>
                <div class="fr-stat-card">
                    <span class="fr-stat-label">Active</span>
                    <span class="fr-stat-value" id="stat-active">—</span>
                </div>
                <div class="fr-stat-card">
                    <span class="fr-stat-label">Total Raised</span>
                    <span class="fr-stat-value" id="stat-raised">—</span>
                </div>
                <div class="fr-stat-card">
                    <span class="fr-stat-label">Donors</span>
                    <span class="fr-stat-value" id="stat-donors">—</span>
                </div>
            </div>

            <!-- Recent Activity -->
            <section class="fr-recent-section">
                <h2 class="fr-recent-title">Recent Activity</h2>
                <div class="platform-activity-card">
                    <h3 class="platform-activity-subtitle">Latest Activities</h3>
                    <div class="fr-activity-list" id="fr-activity-list">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </section>

        </main>

        <footer class="fundly-footer">

            <div class="footer-top">
                <div class="footer-brand">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo"
                        class="footer-logo-img" />
                </div>
                <div class="footer-credits">
                    made by jia yuan, chloe,<br />
                    tara, yaz, yadyoo &amp; hanyi
                </div>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-bottom">
                <i class="bi bi-c-circle footer-copy-icon"></i>
                <span class="footer-copy-text">Fundly</span>
            </div>

        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/scripts/get_fundraiser_stats.js"></script>
        <script src="/scripts/dropdown_profile.js"></script>
    </body>
</html>
