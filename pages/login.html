<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In</title>

  <link rel="stylesheet" href="/styles/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>

<body class="login-page">

  <!--Error modal-->
  <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="errorModalLabel">Login Error</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="errorModalMessage">
           <!-- Error message will be injected here -->
        </div>
      </div>
    </div>
  </div>

  <div class="login-bg-pattern"></div>
 
  <!-- Centred login card -->
  <div class="login-wrapper d-flex align-items-center justify-content-center">
    <div class="login-card">
 
      <div class="login-logo-wrap">
        <img src="/img/fundly-logo.png" alt="Fundly Logo" class="login-logo-img"/>
      </div>
 
      <h1 class="login-title">Sign In</h1>
      <p class="login-subtitle">Sign in, or sign up to continue.</p>
 
      <!-- Form -->
      <form class="login-form" id="login-form" novalidate>
 
        <div class="login-field-wrap">
          <input
            type="email"
            id="loginEmail"
            class="login-input"
            placeholder="Email"
            autocomplete="email"
            required
          />
        </div>
 
        <div class="login-field-wrap">
          <input
            type="password"
            id="loginPassword"
            class="login-input"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
        </div>
 
        <div class="login-divider"></div>
 
        <div class="login-role-row">
          <label for="loginRole" class="login-role-label">Log in as a...</label>
          <select id="loginRole" class="login-role-select">
            <option value="user_admin">User Admin</option>
            <option value="donee">Donee</option>
            <option value="fund_raiser">Fund Raiser</option>
            <option value="platform_mgmt">Platform Mgmt</option>
          </select>
        </div>
 
        <button type="submit" class="login-btn" id="login-btn-id">Sign In</button>
 
      </form>
 
      <!-- Footer link -->
      <p class="login-footer-text">
        Don't have an account?
        <a href="signup.html" class="login-signup-link">Sign up.</a>
      </p>
 
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/scripts/login.js"></script>
</body>

</html>
