<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Manage Fund Raising Activities</title>

        <link rel="stylesheet" href="/styles/styles.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
            rel="stylesheet" />
    </head>
    <body class="manage-fra-page">

        <nav class="fundly-hub-navbar">
            <div class="container-fluid px-4 d-flex align-items-center">
                <div class="hub-nav-logo">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo"
                        class="fundly-logo-img" />
                </div>
                <span class="hub-nav-title">Manage Fund Raising Activities</span>
                <div class="hub-gear-wrap ms-auto">
                    <button class="hub-nav-gear" id="hub-gear-btn" aria-label="Settings">
                        <i class="bi bi-gear-fill"></i>
                    </button>
                    <div id="hub-settings-dropdown" class="hub-settings-dropdown hidden">
                        <p class="hub-dropdown-section">Account</p>
                        <div class="hub-dropdown-user">
                            <div class="hub-dropdown-avatar-wrap">
                                <i class="bi bi-person-fill" id="dropdown-avatar-icon"></i>
                                <img id="dropdown-avatar-img" class="hidden" alt="" />
                            </div>
                            <div>
                                <span class="hub-dropdown-username" id="dropdown-username"></span>
                                <span class="hub-dropdown-role" id="dropdown-role"></span>
                            </div>
                        </div>
                        <div class="hub-dropdown-divider"></div>
                        <a href="profile.html" class="hub-dropdown-item">
                            <i class="bi bi-person-circle"></i>My Profile
                        </a>
                        <a href="#" class="hub-dropdown-item">
                            <i class="bi bi-envelope"></i>Notifications
                        </a>
                        <button class="hub-dropdown-item hub-dropdown-logout" id="hub-logout-btn">
                            <i class="bi bi-box-arrow-right"></i>Logout
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="manage-main">

            <a href="fundraiser_dashboard.html" class="fr-back-link">
                <i class="bi bi-arrow-left-circle"></i> Back
            </a>

            <!-- Header -->
            <div class="manage-header">
                <h2 class="manage-header-title">My Fund Raising Activities</h2>
                <div style="display:flex;gap:10px;">
                    <button class="manage-history-btn" id="manage-history-btn">
                        <i class="bi bi-clock-history"></i> History
                    </button>
                    <button class="manage-new-btn" id="manage-new-btn">
                        <i class="bi bi-plus-circle-fill"></i> New Activity
                    </button>
                </div>
            </div>

            <!-- Search + filter -->
            <div class="manage-controls">
                <div class="manage-search-wrap">
                    <i class="bi bi-search"></i>
                    <input
                        type="text"
                        id="manage-search"
                        class="manage-search-input"
                        placeholder="Search by title..."
                    />
                </div>
                <select id="manage-status-filter" class="manage-status-filter">
                    <option value="">All Status</option>
                    <option value="1">Active</option>
                    <option value="0">Inactive</option>
                </select>
            </div>

            <!-- Activity list -->
            <div class="manage-activity-list" id="manage-activity-list">
                <!-- Populated by JS -->
            </div>

        </main>

        <!-- Delete confirmation modal -->
        <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content fra-delete-modal">
                    <div class="modal-header fra-delete-modal-header border-0">
                        <i class="bi bi-trash-fill fra-delete-modal-icon"></i>
                        <h5 class="modal-title fra-delete-modal-title">Delete Activity</h5>
                    </div>
                    <div class="modal-body fra-delete-modal-body">
                        <p id="delete-modal-msg"></p>
                    </div>
                    <div class="modal-footer fra-delete-modal-footer border-0">
                        <button type="button" class="fr-cancel-btn" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="fra-delete-confirm-btn" id="delete-confirm-btn">Delete</button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="fundly-footer">

            <div class="footer-top">
                <div class="footer-brand">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo"
                        class="footer-logo-img" />
                </div>
                <div class="footer-credits">
                    made by jia yuan, chloe,<br />
                    tara, yaz, yadyoo &amp; hanyi
                </div>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-bottom">
                <i class="bi bi-c-circle footer-copy-icon"></i>
                <span class="footer-copy-text">Fundly</span>
            </div>

        </footer>

        <!-- Edit modal -->
        <div class="modal fade" id="editFRAModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content fra-delete-modal">
                    <div class="modal-header border-0 fra-delete-modal-header">
                        <i class="bi bi-pencil-fill fra-save-modal-icon"></i>
                        <h5 class="modal-title fra-delete-modal-title">Edit Activity</h5>
                        <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body fra-delete-modal-body">
                        <div class="fr-form-row" style="margin-bottom:12px;">
                            <div class="fr-form-group">
                                <label class="fr-form-label">Campaign Title</label>
                                <input type="text" id="fra-edit-title" class="fr-form-input" />
                            </div>
                            <div class="fr-form-group">
                                <label class="fr-form-label">Service Type</label>
                                <input type="text" id="fra-edit-service" class="fr-form-input" />
                            </div>
                        </div>
                        <div class="fr-form-row" style="margin-bottom:12px;">
                            <div class="fr-form-group">
                                <label class="fr-form-label">Goal Amount (SGD)</label>
                                <div class="fr-input-prefix-wrap">
                                    <span class="fr-input-prefix">$</span>
                                    <input type="number" id="fra-edit-goal" class="fr-form-input fr-form-input-prefixed" min="0" />
                                </div>
                            </div>
                            <div class="fr-form-group">
                                <label class="fr-form-label">Category</label>
                                <select id="fra-edit-category" class="fr-form-input fr-form-select">
                                    <option value="" disabled>Loading…</option>
                                </select>
                            </div>
                        </div>
                        <div class="fr-form-row" style="margin-bottom:12px;">
                            <div class="fr-form-group">
                                <label class="fr-form-label">Start Date</label>
                                <input type="date" id="fra-edit-start" class="fr-form-input" />
                            </div>
                            <div class="fr-form-group">
                                <label class="fr-form-label">End Date</label>
                                <input type="date" id="fra-edit-end" class="fr-form-input" />
                            </div>
                        </div>
                        <div class="fr-form-group">
                            <label class="fr-form-label">Status</label>
                            <select id="fra-edit-status" class="fr-form-input fr-form-select">
                                <option value="1">Active</option>
                                <option value="0">Inactive</option>
                            </select>
                        </div>
                        <p class="fra-form-error hidden" id="fra-edit-error"></p>
                    </div>
                    <div class="modal-footer fra-delete-modal-footer border-0">
                        <button type="button" class="fr-cancel-btn" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="fr-submit-btn" id="fra-edit-save-btn">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Success toast -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1100">
            <div id="fra-success-toast" class="toast cat-toast border-0" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="cat-toast-inner">
                    <div class="cat-toast-icon"><i class="bi bi-check-lg"></i></div>
                    <span class="cat-toast-msg" id="fra-toast-msg"></span>
                    <button type="button" class="cat-toast-close" data-bs-dismiss="toast"><i class="bi bi-x"></i></button>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/scripts/manage_FRA.js"></script>
        <script src="/scripts/dropdown_profile.js"></script>
    </body>
</html>
