<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Manage Categories</title>

        <link rel="stylesheet" href="/styles/styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    </head>
    <body class="platform-page">

        <nav class="fundly-hub-navbar">
            <div class="container-fluid px-4 d-flex align-items-center">
                <div class="hub-nav-logo">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo" class="fundly-logo-img" />
                </div>
                <span class="hub-nav-title">Manage Categories</span>
                <div class="hub-gear-wrap ms-auto">
                    <button class="hub-nav-gear" id="hub-gear-btn" aria-label="Settings">
                        <i class="bi bi-gear-fill"></i>
                    </button>
                    <div id="hub-settings-dropdown" class="hub-settings-dropdown hidden">
                        <p class="hub-dropdown-section">Account</p>
                        <div class="hub-dropdown-user">
                            <div class="hub-dropdown-avatar-wrap">
                                <i class="bi bi-person-fill" id="dropdown-avatar-icon"></i>
                                <img id="dropdown-avatar-img" class="hidden" alt="" />
                            </div>
                            <div>
                                <span class="hub-dropdown-username" id="dropdown-username"></span>
                                <span class="hub-dropdown-role" id="dropdown-role"></span>
                            </div>
                        </div>
                        <div class="hub-dropdown-divider"></div>
                        <a href="profile.html" class="hub-dropdown-item">
                            <i class="bi bi-person-circle"></i>My Profile
                        </a>
                        <a href="#" class="hub-dropdown-item">
                            <i class="bi bi-envelope"></i>Notifications
                        </a>
                        <button class="hub-dropdown-item hub-dropdown-logout" id="hub-logout-btn">
                            <i class="bi bi-box-arrow-right"></i>Logout
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="platform-main">

            <a href="platform_dashboard.html" class="fr-back-link">
                <i class="bi bi-arrow-left-circle"></i> Back
            </a>

            <div class="cat-card">

                <!-- Card header -->
                <div class="cat-card-header">
                    <span class="cat-card-title">
                        <i class="bi bi-grid-fill cat-title-icon"></i> FRA Categories
                    </span>
                    <div class="cat-controls">
                        <div class="manage-search-wrap">
                            <i class="bi bi-search"></i>
                            <input type="text" id="cat-search" class="manage-search-input"
                                placeholder="Search categories..." />
                        </div>
                        <select id="cat-status-filter" class="manage-status-filter">
                            <option value="">All Status</option>
                            <option value="1">Active</option>
                            <option value="0">Inactive</option>
                        </select>
                        <button class="cat-new-btn" id="cat-new-btn">
                            <i class="bi bi-plus-lg"></i> New Category
                        </button>
                    </div>
                </div>

                <!-- Table -->
                <div class="cat-table-wrap">
                    <table class="cat-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>CATEGORY NAME</th>
                                <th>DESCRIPTION</th>
                                <th>CAMPAIGNS</th>
                                <th>STATUS</th>
                                <th>CREATED</th>
                                <th>ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody id="cat-table-body">
                        </tbody>
                    </table>
                </div>

            </div>

        </main>

        <footer class="fundly-footer">
            <div class="footer-top">
                <div class="footer-brand">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo" class="footer-logo-img" />
                </div>
                <div class="footer-credits">made by jia yuan, chloe,<br />tara, yaz, yadyoo &amp; hanyi</div>
            </div>
            <div class="footer-divider"></div>
            <div class="footer-bottom">
                <i class="bi bi-c-circle footer-copy-icon"></i>
                <span class="footer-copy-text">Fundly</span>
            </div>
        </footer>

        <!-- View modal -->
        <div class="modal fade" id="viewModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content fra-delete-modal">
                    <div class="modal-header border-0 fra-delete-modal-header">
                        <i class="bi bi-eye-fill" style="color:var(--fundly-primary);font-size:1.1rem;"></i>
                        <h5 class="modal-title fra-delete-modal-title">Category Details</h5>
                        <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body fra-delete-modal-body">
                        <div class="cat-view-grid" id="view-grid"></div>
                    </div>
                    <div class="modal-footer fra-delete-modal-footer border-0">
                        <button type="button" class="fr-cancel-btn" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Create / Edit modal -->
        <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content fra-delete-modal">
                    <div class="modal-header border-0 fra-delete-modal-header">
                        <i class="bi bi-pencil-fill fra-save-modal-icon"></i>
                        <h5 class="modal-title fra-delete-modal-title" id="edit-modal-title">New Category</h5>
                        <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body fra-delete-modal-body">
                        <div class="fr-form-group" style="margin-bottom:12px;">
                            <label class="fr-form-label">Category Name <span style="color:#c0392b">*</span></label>
                            <input type="text" id="edit-name" class="fr-form-input" placeholder="e.g. Education" />
                        </div>
                        <div class="fr-form-group" style="margin-bottom:12px;">
                            <label class="fr-form-label">Description</label>
                            <textarea id="edit-desc" class="fr-form-input fr-form-textarea"
                                placeholder="Brief description of this category"></textarea>
                        </div>
                        <div class="fr-form-group">
                            <label class="fr-form-label">Status</label>
                            <select id="edit-status" class="fr-form-input fr-form-select">
                                <option value="1">Active</option>
                                <option value="0">Inactive</option>
                            </select>
                        </div>
                        <p class="cat-modal-error hidden" id="edit-error"></p>
                    </div>
                    <div class="modal-footer fra-delete-modal-footer border-0">
                        <button type="button" class="fr-cancel-btn" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="fr-submit-btn" id="edit-save-btn">Save</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete confirm modal -->
        <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content fra-delete-modal">
                    <div class="modal-header fra-delete-modal-header border-0">
                        <i class="bi bi-trash-fill fra-delete-modal-icon"></i>
                        <h5 class="modal-title fra-delete-modal-title">Delete Category</h5>
                    </div>
                    <div class="modal-body fra-delete-modal-body">
                        <p id="delete-msg"></p>
                    </div>
                    <div class="modal-footer fra-delete-modal-footer border-0">
                        <button type="button" class="fr-cancel-btn" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="fra-delete-confirm-btn" id="delete-confirm-btn">Delete</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Success toast -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1100">
            <div id="cat-success-toast" class="toast cat-toast border-0" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="cat-toast-inner">
                    <div class="cat-toast-icon">
                        <i class="bi bi-check-lg"></i>
                    </div>
                    <span class="cat-toast-msg" id="cat-toast-msg">Category updated successfully.</span>
                    <button type="button" class="cat-toast-close" data-bs-dismiss="toast" aria-label="Close">
                        <i class="bi bi-x"></i>
                    </button>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/scripts/view_category.js"></script>
        <script src="/scripts/create_category.js"></script>
        <script src="/scripts/update_category.js"></script>
        <script src="/scripts/delete_category.js"></script>
        <script src="/scripts/dropdown_profile.js"></script>
    </body>
</html>
