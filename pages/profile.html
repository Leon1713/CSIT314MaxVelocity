<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Profile</title>

        <link rel="stylesheet" href="/styles/styles.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
            rel="stylesheet" />
    </head>
    <body class="fr-create-page">

        <nav class="fundly-hub-navbar">
            <div class="container-fluid px-4 d-flex align-items-center">
                <div class="hub-nav-logo">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo"
                        class="fundly-logo-img" />
                </div>
                <span class="hub-nav-title">My Profile</span>
                <div class="ms-auto"></div>
            </div>
        </nav>

        <main class="fr-create-main">

            <a href="javascript:history.back()" class="fr-back-link">
                <i class="bi bi-arrow-left-circle"></i> Back
            </a>

            <div class="profile-card">

                <!-- Avatar + identity -->
                <div class="profile-header">
                    <div class="profile-avatar" id="profile-avatar" title="Click to change photo">
                        <i class="bi bi-person-fill" id="profile-avatar-icon"></i>
                        <img id="profile-avatar-img" class="profile-avatar-img hidden" alt="Profile photo" />
                        <div class="profile-avatar-overlay">
                            <i class="bi bi-camera-fill"></i>
                        </div>
                    </div>
                    <input type="file" id="profile-picture-input" accept="image/*" hidden />
                    <div class="profile-identity">
                        <span class="profile-username" id="profile-username">—</span>
                        <span class="profile-email" id="profile-email">—</span>
                    </div>
                </div>

                <div class="profile-divider"></div>

                <!-- Editable fields -->
                <div class="profile-fields">

                    <div class="fr-form-row">
                        <div class="fr-form-group">
                            <label class="fr-form-label">First Name</label>
                            <input type="text" id="profile-first-name" class="fr-form-input" placeholder="First name" />
                        </div>
                        <div class="fr-form-group">
                            <label class="fr-form-label">Last Name</label>
                            <input type="text" id="profile-last-name" class="fr-form-input" placeholder="Last name" />
                        </div>
                    </div>

                    <div class="fr-form-group">
                        <label class="fr-form-label">Email</label>
                        <input type="email" id="profile-email-input" class="fr-form-input" placeholder="Email" />
                    </div>

                    <div class="fr-form-group">
                        <label class="fr-form-label">Mobile Number</label>
                        <input type="tel" id="profile-phone" class="fr-form-input" placeholder="Add number" />
                    </div>

                    <div class="fr-form-group">
                        <label class="fr-form-label">Bio</label>
                        <textarea id="profile-bio" class="fr-form-input fr-form-textarea" placeholder="Tell us about yourself"></textarea>
                    </div>

                    <div class="fr-form-row">
                        <div class="fr-form-group">
                            <label class="fr-form-label">City</label>
                            <input type="text" id="profile-city" class="fr-form-input" placeholder="City" />
                        </div>
                        <div class="fr-form-group">
                            <label class="fr-form-label">Country</label>
                            <input type="text" id="profile-country" class="fr-form-input" placeholder="Country" />
                        </div>
                    </div>

                </div>

                <p class="profile-error hidden" id="profile-error"></p>
                <p class="profile-success hidden" id="profile-success">Changes saved successfully.</p>

                <div class="fr-form-actions">
                    <button class="fr-submit-btn" id="profile-save-btn">Save Changes</button>
                </div>

            </div>

        </main>

        <footer class="fundly-footer">
            <div class="footer-top">
                <div class="footer-brand">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo" class="footer-logo-img" />
                </div>
                <div class="footer-credits">
                    made by jia yuan, chloe,<br />
                    tara, yaz, yadyoo &amp; hanyi
                </div>
            </div>
            <div class="footer-divider"></div>
            <div class="footer-bottom">
                <i class="bi bi-c-circle footer-copy-icon"></i>
                <span class="footer-copy-text">Fundly</span>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/scripts/get_user_profile.js"></script>
    </body>
</html>
