<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fundly — Join Us</title>

  <link rel="stylesheet" href="/styles/styles.css"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

</head>
<body class="login-page">

  <!-- Animated tiling background -->
  <div class="login-bg-pattern"></div>

  <!-- Centred signup card -->
  <div class="login-wrapper d-flex align-items-center justify-content-center">
    <div class="login-card">

      <div class="login-logo-wrap">
        <img src="/img/fundly-logo.png" alt="Fundly Logo" class="login-logo-img"/>
      </div>

      <h1 class="login-title">Join Us</h1>
      <p class="login-subtitle">Sign up to use our platform.</p>

      <form class="login-form" novalidate>

        <div class="login-field-wrap">
          <input
            type="text"
            id="signupName"
            class="login-input"
            placeholder="Name"
            autocomplete="name"
            required
          />
        </div>

        <div class="login-field-wrap">
          <input
            type="email"
            id="signupEmail"
            class="login-input"
            placeholder="Email"
            autocomplete="email"
            required
          />
        </div>

        <div class="login-field-wrap">
          <input
            type="password"
            id="signupPassword"
            class="login-input"
            placeholder="Password"
            autocomplete="new-password"
            required
          />
        </div>

        <button type="submit" class="login-btn">Sign Up</button>

      </form>

      <!-- Footer link -->
      <p class="login-footer-text">
        Already have an account?
        <a href="login.html" class="login-signup-link">Sign in.</a>
      </p>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
