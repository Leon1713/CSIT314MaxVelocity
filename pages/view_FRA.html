<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>View Fund Raising Activity</title>

        <link rel="stylesheet" href="/styles/styles.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
            rel="stylesheet" />
    </head>
    <body class="fr-create-page">

        <nav class="fundly-hub-navbar">
            <div class="container-fluid px-4 d-flex align-items-center">
                <div class="hub-nav-logo">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo"
                        class="fundly-logo-img" />
                    <span class="hub-nav-brand">Fundly</span>
                </div>
                <span class="hub-nav-title">View Fund Raising Activity</span>
                <div class="hub-gear-wrap ms-auto">
                    <button class="hub-nav-gear" id="hub-gear-btn" aria-label="Settings">
                        <i class="bi bi-gear-fill"></i>
                    </button>
                    <div id="hub-settings-dropdown" class="hub-settings-dropdown hidden">
                        <p class="hub-dropdown-section">Account</p>
                        <div class="hub-dropdown-user">
                            <span class="hub-dropdown-username" id="dropdown-username"></span>
                            <span class="hub-dropdown-role" id="dropdown-role"></span>
                        </div>
                        <div class="hub-dropdown-divider"></div>
                        <a href="#" class="hub-dropdown-item">
                            <i class="bi bi-person-circle"></i>My Profile
                        </a>
                        <a href="#" class="hub-dropdown-item">
                            <i class="bi bi-envelope"></i>Notifications
                        </a>
                        <button class="hub-dropdown-item hub-dropdown-logout" id="hub-logout-btn">
                            <i class="bi bi-box-arrow-right"></i>Logout
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="fr-create-main">

            <a href="fundraiser_dashboard.html" class="fr-back-link">
                <i class="bi bi-arrow-left-circle"></i> Back
            </a>

            <!-- Title banner -->
            <div class="fra-banner">
                <span class="fra-banner-title" id="fra-title">—</span>
                <span class="fra-banner-service" id="fra-banner-service">—</span>
                <span class="fra-banner-category" id="fra-category">—</span>
            </div>

            <!-- Raised / Goal / Days Left -->
            <div class="fra-stats-row">
                <div class="fra-stat-card">
                    <span class="fra-stat-value" id="fra-raised">—</span>
                    <span class="fra-stat-label">Raised</span>
                </div>
                <div class="fra-stat-card">
                    <span class="fra-stat-value" id="fra-goal">—</span>
                    <span class="fra-stat-label">Goal</span>
                </div>
                <div class="fra-stat-card">
                    <span class="fra-stat-value" id="fra-days">—</span>
                    <span class="fra-stat-label">Days Left</span>
                </div>
            </div>

            <!-- Description + status -->
            <div class="fra-desc-card">
                <div class="fra-desc-body">
                    <span class="fra-desc-label">Description</span>
                    <p class="fra-desc-text" id="fra-service-type">—</p>
                </div>
                <div class="fra-status-badge" id="fra-status-badge">
                    <span class="fra-status-dot" id="fra-status-dot"></span>
                    <span id="fra-status-text">—</span>
                </div>
            </div>

            <!-- Dates -->
            <div class="fr-form-row">
                <div class="fra-date-card">
                    <span class="fra-date-label">Start Date</span>
                    <span class="fra-date-value" id="fra-start">—</span>
                </div>
                <div class="fra-date-card">
                    <span class="fra-date-label">End Date</span>
                    <span class="fra-date-value" id="fra-end">—</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="fr-form-actions">
                <a href="fundraiser_dashboard.html" class="fr-cancel-btn">Close</a>
                <button class="fra-delete-btn" id="fra-delete-btn">Delete</button>
                <button class="fr-submit-btn" id="fra-edit-btn">Edit</button>
            </div>

        </main>

        <footer class="fundly-footer">

            <div class="footer-top">
                <div class="footer-brand">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo"
                        class="footer-logo-img" />
                </div>
                <div class="footer-credits">
                    made by jia yuan, chloe,<br />
                    tara, yaz, yadyoo &amp; hanyi
                </div>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-bottom">
                <i class="bi bi-c-circle footer-copy-icon"></i>
                <span class="footer-copy-text">Fundly</span>
            </div>

        </footer>

        <!-- Delete confirmation modal -->
        <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content fra-delete-modal">
                    <div class="modal-header fra-delete-modal-header border-0">
                        <i class="bi bi-trash-fill fra-delete-modal-icon"></i>
                        <h5 class="modal-title fra-delete-modal-title">Delete Activity</h5>
                    </div>
                    <div class="modal-body fra-delete-modal-body">
                        <p id="delete-modal-msg"></p>
                    </div>
                    <div class="modal-footer fra-delete-modal-footer border-0">
                        <button type="button" class="fr-cancel-btn" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="fra-delete-confirm-btn" id="delete-confirm-btn">Delete</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/scripts/view_FRA.js"></script>
    </body>
</html>
