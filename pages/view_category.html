<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>View Category</title>

        <link rel="stylesheet" href="/styles/styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    </head>
    <body class="fr-create-page">

        <nav class="fundly-hub-navbar">
            <div class="container-fluid px-4 d-flex align-items-center">
                <div class="hub-nav-logo">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo" class="fundly-logo-img" />
                </div>
                <span class="hub-nav-title">View Category</span>
                <div class="hub-gear-wrap ms-auto">
                    <button class="hub-nav-gear" id="hub-gear-btn" aria-label="Settings">
                        <i class="bi bi-gear-fill"></i>
                    </button>
                    <div id="hub-settings-dropdown" class="hub-settings-dropdown hidden">
                        <p class="hub-dropdown-section">Account</p>
                        <div class="hub-dropdown-user">
                            <div class="hub-dropdown-avatar-wrap">
                                <i class="bi bi-person-fill" id="dropdown-avatar-icon"></i>
                                <img id="dropdown-avatar-img" class="hidden" alt="" />
                            </div>
                            <div>
                                <span class="hub-dropdown-username" id="dropdown-username"></span>
                                <span class="hub-dropdown-role" id="dropdown-role"></span>
                            </div>
                        </div>
                        <div class="hub-dropdown-divider"></div>
                        <a href="profile.html" class="hub-dropdown-item">
                            <i class="bi bi-person-circle"></i>My Profile
                        </a>
                        <a href="#" class="hub-dropdown-item">
                            <i class="bi bi-envelope"></i>Notifications
                        </a>
                        <button class="hub-dropdown-item hub-dropdown-logout" id="hub-logout-btn">
                            <i class="bi bi-box-arrow-right"></i>Logout
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="fr-create-main">

            <a href="manage_categories.html" class="fr-back-link">
                <i class="bi bi-arrow-left-circle"></i> Back
            </a>

            <!-- Banner -->
            <div class="fra-banner">
                <span class="fra-banner-title" id="cat-name">—</span>
                <span class="fra-banner-category" id="cat-id-label">—</span>
            </div>

            <!-- Stats row -->
            <div class="fra-stats-row">
                <div class="fra-stat-card">
                    <span class="fra-stat-value" id="cat-campaigns">—</span>
                    <span class="fra-stat-label">Campaigns</span>
                </div>
                <div class="fra-stat-card">
                    <span class="fra-stat-value" id="cat-created">—</span>
                    <span class="fra-stat-label">Created</span>
                </div>
                <div class="fra-stat-card">
                    <span class="fra-stat-value" id="cat-updated">—</span>
                    <span class="fra-stat-label">Last Updated</span>
                </div>
            </div>

            <!-- Description + status -->
            <div class="fra-desc-card">
                <div class="fra-desc-body">
                    <span class="fra-desc-label">Description</span>
                    <p class="fra-desc-text" id="cat-description">—</p>
                </div>
                <div class="fra-status-badge" id="cat-status-badge">
                    <span class="fra-status-dot" id="cat-status-dot"></span>
                    <span id="cat-status-text">—</span>
                </div>
            </div>

            <!-- Dates row -->
            <div class="fr-form-row">
                <div class="fra-date-card">
                    <span class="fra-date-label">Created At</span>
                    <span class="fra-date-value" id="cat-created-full">—</span>
                </div>
                <div class="fra-date-card">
                    <span class="fra-date-label">Updated At</span>
                    <span class="fra-date-value" id="cat-updated-full">—</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="fr-form-actions">
                <a href="manage_categories.html" class="fr-cancel-btn">Close</a>
                <button class="fra-delete-btn" id="cat-delete-btn">Delete</button>
                <button class="fr-submit-btn" id="cat-edit-btn">Edit</button>
            </div>

        </main>

        <!-- Edit modal -->
        <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content fra-delete-modal">
                    <div class="modal-header border-0 fra-delete-modal-header">
                        <i class="bi bi-pencil-fill fra-save-modal-icon"></i>
                        <h5 class="modal-title fra-delete-modal-title">Edit Category</h5>
                        <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body fra-delete-modal-body">
                        <div class="fr-form-group" style="margin-bottom:12px;">
                            <label class="fr-form-label">Category Name <span style="color:#c0392b">*</span></label>
                            <input type="text" id="edit-name" class="fr-form-input" />
                        </div>
                        <div class="fr-form-group" style="margin-bottom:12px;">
                            <label class="fr-form-label">Description</label>
                            <textarea id="edit-desc" class="fr-form-input fr-form-textarea"></textarea>
                        </div>
                        <div class="fr-form-group">
                            <label class="fr-form-label">Status</label>
                            <select id="edit-status" class="fr-form-input fr-form-select">
                                <option value="1">Active</option>
                                <option value="0">Inactive</option>
                            </select>
                        </div>
                        <p class="cat-modal-error hidden" id="edit-error"></p>
                    </div>
                    <div class="modal-footer fra-delete-modal-footer border-0">
                        <button type="button" class="fr-cancel-btn" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="fr-submit-btn" id="edit-save-btn">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete confirmation modal -->
        <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content fra-delete-modal">
                    <div class="modal-header fra-delete-modal-header border-0">
                        <i class="bi bi-trash-fill fra-delete-modal-icon"></i>
                        <h5 class="modal-title fra-delete-modal-title">Delete Category</h5>
                    </div>
                    <div class="modal-body fra-delete-modal-body">
                        <p id="delete-modal-msg"></p>
                    </div>
                    <div class="modal-footer fra-delete-modal-footer border-0">
                        <button type="button" class="fr-cancel-btn" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="fra-delete-confirm-btn" id="delete-confirm-btn">Delete</button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="fundly-footer">
            <div class="footer-top">
                <div class="footer-brand">
                    <img src="../img/fundly-logo.png" alt="Fundly Logo" class="footer-logo-img" />
                </div>
                <div class="footer-credits">made by jia yuan, chloe,<br />tara, yaz, yadyoo &amp; hanyi</div>
            </div>
            <div class="footer-divider"></div>
            <div class="footer-bottom">
                <i class="bi bi-c-circle footer-copy-icon"></i>
                <span class="footer-copy-text">Fundly</span>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/scripts/get_category_details.js"></script>
        <script src="/scripts/dropdown_profile.js"></script>
    </body>
</html>
